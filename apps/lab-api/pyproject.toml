[project]
name = "lab-api"
version = "0.1.0"
description = "Local lab FastAPI: training, hp search, model management, scraping, publish."
requires-python = ">=3.13"
dependencies = [
    "ufc-core",
    "fastapi>=0.115",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio", "httpx>=0.27"]

[project.scripts]
lab-api = "lab_api.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
