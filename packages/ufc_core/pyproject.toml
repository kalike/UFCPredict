[project]
name = "ufc-core"
version = "0.1.0"
description = "Shared core for UFC predictor: features, training, inference, scrapers, betting."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
    "torch>=2.1",
    "joblib>=1.3",
    "optuna>=3.5",
    "requests",
    "beautifulsoup4",
    "playwright>=1.40",
    "rapidfuzz>=3.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.1"]

[project.scripts]
ufc-publish = "ufc_core.publish.cli:main"
ufc-seed    = "ufc_core.scrapers.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
